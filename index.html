    <style>
        :root {
            --bg-pure: #000000;
            --bg-card: #121212;
            --bg-input: #1c1c1e;
            --text-main: #ffffff;
            --text-sec: #a1a1aa; 
            --accent: #ffffff; 
            --error: #ef4444; 
            --success: #22c55e;
            --border: #27272a;
        }

        html, body, .page-view, div, * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        
        ::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
            background: transparent !important;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: pan-y; 
            overscroll-behavior: none;
        }

        input, textarea {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            position: fixed;
        }

        .home-loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
            touch-action: none;
        }
        
        .home-loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .home-loading-logo {
            width: clamp(92px, 25vw, 142px);
            max-width: 40vw;
            display: block;
            object-fit: contain;
        }

        @media (prefers-color-scheme: light) {
            .home-loading-screen { background: #ffffff; }
            .home-loading-logo { content: url('https://adamdh7.org/adamdh7.png'); }
        }

        @media (prefers-color-scheme: dark) {
            .home-loading-screen { background: #000000; }
            .home-loading-logo { content: url('https://adamdh7.org/asset/nwa.png'); }
        }

        .brand-text {
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.05em;
        }

        .modern-input {
            background: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 18px;
            color: white;
            width: 100%;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .modern-input:focus {
            border-color: var(--text-sec);
        }

        input[type="date"] {
            -webkit-appearance: none;
            color: white;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .page-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: none; 
            padding-bottom: 80px; 
        }
        .page-view.active { display: flex; }

        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px;
            background: var(--bg-pure);
            z-index: 50;
        }

        .menu-btn {
            color: var(--text-main);
            background: none; border: none; padding: 0; cursor: pointer;
        }

        .side-menu {
            position: fixed; top: 0; left: 0; bottom: 0; width: 300px;
            background: #0a0a0a; z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 1px solid var(--border);
            padding: 40px 30px; display: flex; flex-direction: column;
        }
        .side-menu.open { transform: translateX(0); }

        .menu-user-name {
            font-size: 1.5rem; font-weight: 700; color: white;
            line-height: 1.2;
            word-wrap: break-word;
        }

        .menu-btn-item {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 20px 0;
            background: transparent; border: none;
            color: var(--text-sec); font-size: 1.1rem; font-weight: 500;
            cursor: pointer; text-align: center;
        }
        .menu-btn-item:hover, .menu-btn-item:active { color: white; }
        .menu-btn-item.logout { color: var(--error); margin-top: auto; }

        .dash-content {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer;
        }
        .play-icon {
            width: 80px; height: 80px; fill: white; margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .dash-content:active .play-icon { transform: scale(0.9); }
        .level-indicator {
            font-size: 1rem; color: var(--text-sec); letter-spacing: 0.2em; text-transform: uppercase;
            margin-bottom: 8px;
        }
        .progress-dots {
            display: flex; gap: 4px;
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%; background: #333;
        }
        .dot.active { background: white; }

        .quiz-container {
            max-width: 600px; width: 100%; margin: 0 auto;
            padding: 0 24px 40px 24px;
            display: flex; flex-direction: column; flex: 1;
        }

        .question-txt {
            font-size: 1.8rem; font-weight: 800; text-align: center;
            margin: 20px 0 30px 0; line-height: 1.2; color: white;
        }
        
        .quiz-img {
            width: 100%; max-height: 300px; object-fit: contain;
            border-radius: 16px; margin-bottom: 24px; background: #000;
        }

        .opt-btn {
            background: var(--bg-input);
            color: var(--text-sec);
            padding: 20px; border-radius: 16px;
            margin-bottom: 12px; width: 100%;
            text-align: left; font-size: 1.1rem; font-weight: 600;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .opt-btn:active {
            background: white; color: black; transform: scale(0.98);
        }

        .opt-btn.processing {
            background-color: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
            opacity: 1 !important;
        }
        
        .opt-btn.success {
            background-color: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
            opacity: 1 !important;
        }
        
        .opt-btn.disabled {
            pointer-events: none !important;
        }

        .text-answer-area {
            width: 100%; text-align: center; margin-top: 20px;
        }
        .quiz-text-input {
            background: transparent; border: none;
            border-bottom: 2px solid var(--text-sec);
            color: white; font-size: 1.5rem; text-align: center;
            width: 100%; padding: 10px 0; outline: none;
            border-radius: 0;
            transition: border-bottom-color 0.3s;
        }
        .quiz-text-input:focus { border-bottom-color: white; }
        .quiz-text-input:disabled { opacity: 0.5; border-bottom-color: #333; }

        .validate-btn {
            margin-top: 30px;
            background: white; color: black;
            font-weight: 900; padding: 16px 40px;
            border-radius: 50px; border: none;
            font-size: 1rem; cursor: pointer;
            min-width: 160px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .validate-btn.disabled { pointer-events: none; opacity: 0.8; }
        
        .btn-loader {
            width: 24px; height: 24px;
            color: black;
            animation: spin 1s infinite linear;
        }

        .feedback-overlay {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #111; padding: 30px 24px;
            border-top: 1px solid #333; z-index: 100;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .feedback-overlay.show { transform: translateY(0); }
        .feedback-overlay.err { border-top: 2px solid var(--error); }
        
        .fb-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; }
        .err .fb-title { color: var(--error); }
        
        .fb-desc { color: var(--text-sec); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.4; }
        
        .next-btn {
            width: 100%; background: #333; color: white;
            padding: 18px; border-radius: 14px; font-weight: 700; border: none;
        }

        .loader {
            width: 24px; height: 24px; border: 3px solid #333;
            border-top-color: white; border-radius: 50%;
            animation: spin 1s infinite linear; margin: auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }

        .lang-modal, .ios-info-modal {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #161617; z-index: 300;
            border-radius: 24px 24px 0 0; padding-bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translateY(100%); 
            transition: transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
            will-change: transform;
        }
        .lang-modal.active, .ios-info-modal.active { transform: translateY(0); }
        
        .swipe-handle-area {
            width: 100%;
            padding: 16px 0 20px 0;
            display: flex;
            justify-content: center;
            cursor: grab;
            touch-action: none;
        }
        
        .lang-opt {
            padding: 18px; text-align: center;
            color: white; font-weight: 600;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .lang-opt:active { background: #2c2c2e; border-radius: 12px; margin: 0 12px; }

        .ios-toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 999999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .ios-toast.show {
            top: 40px;
            opacity: 1;
        }
    </style>
</head>

    <script>
        const appStartTime = Date.now();

        function showSplash() { 
            const screen = document.getElementById('loading-screen'); 
            if (screen) screen.classList.remove('hidden'); 
        }

        function hideSplash() { 
            const screen = document.getElementById('loading-screen'); 
            if (screen) screen.classList.add('hidden'); 
        }

        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F5' || 
                (e.ctrlKey && e.key === 'r') || 
                (e.metaKey && e.key === 'r')
            ) {
                e.preventDefault();
            }
        });

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchmove', function(event) {
            if (event.scale !== 1) { 
                event.preventDefault(); 
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        window.onbeforeunload = function() {
            return "Prevent";
        };

        const AUTH_API = "https://server.dh7.adamdh7.org";
        const QUIZ_SERVERS = [
            "https://server.quiz.adamdh7.org"
        ];

        const translations = {
            ht: { subtitle: "Digital HUB 7", "placeholder-tfid": "TFID oswa DH7", "placeholder-password": "Modpas", connect: "Konekte", register: "KREYE YON KONT", "create-account": "JOIN", "back-to-login": "RETOUNEN", "change-lang": "Chanje Lang", logout: "Dekonekte", error_title: "ERÈ", success_title: "KÒRÈK", valider: "VALIDE", level_label: "Nivo", "copied-toast": "Ou kopye", "view-profile-btn": "Klike pou wè pwofil ou", "profile-title": "Enfòmasyon Pwofil", "info-label-name": "NON AK SIYEN", "info-label-progression": "PROGRESYON", "placeholder-dob": "Dat nesans" },
            fr: { subtitle: "Digital HUB 7", "placeholder-tfid": "TFID ou DH7", "placeholder-password": "Mot de passe", connect: "Se connecter", register: "CRÉER UN COMPTE", "create-account": "REJOINDRE", "back-to-login": "RETOUR", "change-lang": "Changer Langue", logout: "Déconnexion", error_title: "ERREUR", success_title: "EXCELLENT", valider: "VALIDER", level_label: "Niveau", "copied-toast": "Vous avez copié", "view-profile-btn": "Cliquez pour voir votre profil", "profile-title": "Informations Profil", "info-label-name": "NOM ET PRÉNOM", "info-label-progression": "PROGRESSION", "placeholder-dob": "Date de naissance" },
            en: { subtitle: "Digital HUB 7", "placeholder-tfid": "TFID or DH7", "placeholder-password": "Password", connect: "Login", register: "CREATE ACCOUNT", "create-account": "JOIN", "back-to-login": "BACK", "change-lang": "Change Language", logout: "Log Out", error_title: "WRONG", success_title: "CORRECT", valider: "SUBMIT", level_label: "Level", "copied-toast": "You copied", "view-profile-btn": "Click to view your profile", "profile-title": "Profile Information", "info-label-name": "FULL NAME", "info-label-progression": "PROGRESSION", "placeholder-dob": "Date of birth" },
            es: { subtitle: "Digital HUB 7", "placeholder-tfid": "TFID o DH7", "placeholder-password": "Contraseña", connect: "Conectar", register: "CREAR CUENTA", "create-account": "UNIRSE", "back-to-login": "VOLVER", "change-lang": "Cambiar Idioma", logout: "Cerrar Sesión", error_title: "ERROR", success_title: "CORRECTO", valider: "VALIDAR", level_label: "Nivel", "copied-toast": "Has copiado", "view-profile-btn": "Haz clic para ver tu perfil", "profile-title": "Información del Perfil", "info-label-name": "NOMBRE Y APELLIDO", "info-label-progression": "PROGRESO", "placeholder-dob": "Fecha de nacimiento" }
        };

        let state = {
            user: JSON.parse(localStorage.getItem('dh7_session')) || null,
            lang: 'ht',
            step: 1,
            progress: 0
        };

        function initLanguage() {
            let savedLang = localStorage.getItem('language');
            if (!savedLang) {
                let navLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
                savedLang = ['fr', 'en', 'es', 'ht'].includes(navLang) ? navLang : 'ht';
                localStorage.setItem('language', savedLang);
            }
            state.lang = savedLang;
        }

        initLanguage();

        function showToast(text) {
            const toast = document.getElementById('ios-toast');
            const prefix = translations[state.lang]["copied-toast"] || "Copied";
            toast.innerText = `${prefix}: ${text}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function copyText(text) {
            if(!text) return;
            const textToCopy = text.replace(/^(TFID: |DH7: )/, '');
            navigator.clipboard.writeText(textToCopy).then(() => showToast(textToCopy)).catch(e => console.log(e));
        }

        function copyTextFromElement(elemId) {
            const el = document.getElementById(elemId);
            if(el && el.innerText && el.innerText !== '-') copyText(el.innerText);
        }

        let isInteractionLocked = false; 
        let pendingAction = null;

        async function fetchQuizAPI(endpoint, options = {}) {
            for (const server of QUIZ_SERVERS) {
                try {
                    const url = server + endpoint;
                    const res = await fetch(url, options);
                    
                    if (!res.ok && res.status >= 500) throw new Error(res.status);
                    if (res.status === 404) throw new Error("404");
                    
                    return res; 
                } catch (e) {
                    continue; 
                }
            }
            throw new Error("All servers failed");
        }

        function getSessionId() {
            if (state.user && state.user.identifier) {
                return state.user.identifier;
            }
            return 'unknown_user';
        }

        function handleEnter(event, nextId, callback) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (nextId) {
                    document.getElementById(nextId).focus();
                } else if (callback) {
                    callback();
                }
            }
        }

        const router = {
            routes: {
                '/login': 'view-auth',
                '/dashboard': 'view-dashboard',
                '/quiz': 'view-quiz'
            },
            init: function() {
                window.addEventListener('popstate', () => this.handleLocation());
                let path = window.location.pathname;
                if(path === '/' || path === '') path = state.user ? '/dashboard' : '/login';
                this.navigate(path, true);
                
                const elapsed = Date.now() - appStartTime;
                const delay = Math.max(0, 1500 - elapsed);
                setTimeout(hideSplash, delay);
            },
            navigate: function(path, replace = false) {
                if(!state.user && path !== '/login') path = '/login';
                if(state.user && path === '/login') path = '/dashboard';

                if(replace) window.history.replaceState({}, "", path);
                else window.history.pushState({}, "", path);
                
                this.handleLocation();
            },
            handleLocation: async function() {
                const path = window.location.pathname;
                const viewId = this.routes[path] || 'view-auth';
                
                document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
                const view = document.getElementById(viewId);
                if(view) {
                    view.classList.add('active');
                    if(viewId === 'view-dashboard') await updateDashboard();
                    if(viewId === 'view-quiz') await loadQuizQuestion();
                }
            }
        };

        async function handleLogin() {
            let id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;
            if(!id || !pass) return;
            if (!id.includes('@') && !id.startsWith('TF-')) id += '@dh7.tf';

            const btn = document.getElementById('login-btn');
            const originalText = btn.innerText;
            btn.innerHTML = `<svg class="w-6 h-6 mx-auto text-gray-500 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

            try {
                const res = await fetch(`${AUTH_API}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: id, password: pass })
                });
                const data = await res.json();
                if(data.success) {
                    state.user = data.user;
                    state.user.identifier = id; 
                    localStorage.setItem('dh7_session', JSON.stringify(state.user));
                    router.navigate('/dashboard');
                } else {
                    alert(data.error || "Identifiants invalides");
                }
            } catch(e) { 
                alert("Erreur de connexion au serveur"); 
            } finally {
                if (btn) btn.innerText = originalText;
            }
        }

        async function handleRegister() {
            const nom = document.getElementById('reg-nom').value.trim();
            const prenom = document.getElementById('reg-prenom').value.trim();
            let dh7Input = document.getElementById('reg-dh7').value.trim().toLowerCase().replace(/@dh7\.tf$/i, '');
            const dateVal = document.getElementById('reg-age').value.trim();
            const password = document.getElementById('reg-pass').value;

            if(!nom || !prenom || !dh7Input || !dateVal || !password) {
                alert("Veuillez remplir tous les champs obligatoires.");
                return;
            }

            if (!/^[a-z0-9]+$/.test(dh7Input)) {
                alert("Le DH7 ID ne doit contenir que des lettres minuscules et des chiffres.");
                return;
            }

            try {
                const res = await fetch(`${AUTH_API}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://dh7.adamdh7.org'
                    },
                    body: JSON.stringify({
                        nom: nom,
                        prenom: prenom,
                        dh7: dh7Input,
                        age: dateVal,
                        password: password
                    })
                });

                const data = await res.json();

                if(res.ok && data.success) {
                    const fullIdentifier = dh7Input + '@dh7.tf';
                    state.user = {
                        nom: nom,
                        prenom: prenom,
                        identifier: fullIdentifier,
                        age: dateVal
                    };
                    if (data.tfid) {
                        state.user.tfid = data.tfid;
                    }
                    localStorage.setItem('dh7_session', JSON.stringify(state.user));

                    const messages = {
                        ht: `Kont kreye avèk siksè !\nTFID ou : ${data.tfid || 'pa disponib'}\nItilize DH7 ID ou oswa TFID sa pou konekte.`,
                        fr: `Compte créé avec succès !\nVotre TFID : ${data.tfid || 'non disponible'}\nUtilisez votre DH7 ID ou ce TFID pour vous connecter.`,
                        en: `Account created successfully!\nYour TFID: ${data.tfid || 'not available'}\nUse your DH7 ID or this TFID to log in.`,
                        es: `¡Cuenta creada con éxito!\nSu TFID: ${data.tfid || 'no disponible'}\nUse su DH7 ID o este TFID para iniciar sesión.`
                    };
                    alert(messages[state.lang] || messages['fr']);

                    router.navigate('/dashboard');
                } else {
                    alert(data.error || "Erreur lors de l'inscription");
                }
            } catch(e) {
                alert("Erreur de connexion au serveur");
            }
        }

        function toggleAuthMode() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('reg-form').classList.toggle('hidden');
        }

        function logout() {
            localStorage.clear();
            showSplash();
            setTimeout(() => {
                location.reload(); 
            }, 1500);
        }

        async function updateDashboard() {
            applyTranslations();
            const sessionId = getSessionId();

            try {
                const res = await fetchQuizAPI(`/step?session_id=${sessionId}`);
                const data = await res.json();
                
                let sStep = data.current_step;
                let sProg = data.consecutive_correct;
                let lData = JSON.parse(localStorage.getItem('dh7_progress'));
                
                if (!sStep || sStep === 0 || (sStep === 1 && (!sProg || sProg === 0))) {
                    if (lData && (lData.step !== sStep || lData.progress !== sProg)) {
                        fetch('https://server.quiz.adamdh7.org/user-info', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                "DH7": state.user ? state.user.identifier : "",
                                "level": lData.step,
                                "nivo": lData.progress,
                                "TFID": state.user && state.user.tfid ? state.user.tfid : ""
                            })
                        }).catch(e => e);
                        
                        state.step = lData.step;
                        state.progress = lData.progress;
                    } else {
                        state.step = sStep || 1;
                        state.progress = sProg || 0;
                        localStorage.setItem('dh7_progress', JSON.stringify({step: state.step, progress: state.progress}));
                    }
                } else {
                    state.step = sStep || 1;
                    state.progress = sProg || 0;
                    localStorage.setItem('dh7_progress', JSON.stringify({step: state.step, progress: state.progress}));
                }
            } catch(e) {
                let lData = JSON.parse(localStorage.getItem('dh7_progress'));
                if(lData) {
                    state.step = lData.step;
                    state.progress = lData.progress;
                }
            }

            const levelLabel = (translations[state.lang] && translations[state.lang].level_label) ? translations[state.lang].level_label : "Level";

            if (state.user) {
                const fullName = `${state.user.prenom || ''} ${state.user.nom || ''}`.trim();
                document.getElementById('menu-name-display').innerText = fullName || 'User';
                
                document.getElementById('info-name-txt').innerText = fullName || 'User';
                document.getElementById('info-tfid-txt').innerText = state.user.tfid || '-';
                document.getElementById('info-dh7-txt').innerText = state.user.identifier || '-';
                document.getElementById('info-tfid-box').style.display = state.user.tfid ? 'flex' : 'none';
                document.getElementById('info-prog-txt').innerText = `${levelLabel} ${state.step} | Points: ${state.progress}`;
                
                document.getElementById('dash-level').innerText = `${fullName || 'User'} — ${levelLabel} ${state.step}`;
            } else {
                document.getElementById('dash-level').innerText = `${levelLabel} ${state.step}`;
            }

            const dotsContainer = document.getElementById('dash-dots');
            dotsContainer.innerHTML = '';
            for(let i = 0; i < 7; i++) {
                const dot = document.createElement('div');
                dot.className = `dot ${i < state.progress ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            }
        }

        function toggleMenu(show) {
            const menu = document.getElementById('side-menu');
            const bd = document.getElementById('backdrop');
            if(show === true) {
                menu.classList.add('open');
                bd.classList.add('active');
            } else {
                menu.classList.remove('open');
                bd.classList.remove('active');
            }
        }

        function openInfoModal() {
            toggleMenu(false);
            document.getElementById('backdrop').classList.add('active');
            document.getElementById('ios-info-modal').classList.add('active');
        }

        async function loadQuizQuestion() {
            isInteractionLocked = false;
            
            const loader = document.getElementById('quiz-loader');
            const content = document.getElementById('quiz-content');
            const sheet = document.getElementById('feedback-sheet');
            
            sheet.classList.remove('show');
            content.classList.add('hidden');
            loader.classList.remove('hidden');

            const sessionId = getSessionId();

            try {
                const res = await fetchQuizAPI('/quizz', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ session_id: sessionId, lang: state.lang })
                });
                const data = await res.json();
                renderQuiz(data);
            } catch(e) {
                console.error(e);
            } finally {
                loader.classList.add('hidden');
                content.classList.remove('hidden');
            }
        }

        function renderQuiz(data) {
            const container = document.getElementById('quiz-content');
            container.innerHTML = '';

            if(data.image_url) {
                container.innerHTML += `<img src="${data.image_url}" class="quiz-img" alt="Quiz image">`;
            }

            container.innerHTML += `<div class="question-txt">${data.question}</div>`;

            if (data.options && Array.isArray(data.options)) {
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerText = opt;
                    btn.onclick = function() { handleOptionClick(this, opt); };
                    container.appendChild(btn);
                });
            } else {
                const t = translations[state.lang];
                container.innerHTML += `
                    <div class="text-answer-area">
                        <input type="text" id="quiz-input-text" class="quiz-text-input" placeholder="" autocomplete="off" onfocus="handleInputFocus(this)">
                        <button id="btn-valider" class="validate-btn" onclick="handleTextSubmit()">${t.valider || 'VALIDE'}</button>
                    </div>
                `;
            }
        }

        function handleInputFocus(el) {
            setTimeout(() => {
                el.scrollIntoView({behavior: 'smooth', block: 'center'});
            }, 300);
        }

        function handleOptionClick(btnElement, value) {
            if (isInteractionLocked) return;
            
            isInteractionLocked = true;
            
            btnElement.classList.add('processing');
            
            const allBtns = document.querySelectorAll('.opt-btn');
            allBtns.forEach(btn => btn.classList.add('disabled'));

            submitAnswer(value, btnElement);
        }

        function handleTextSubmit() {
            if (isInteractionLocked) return;
            
            const inputField = document.getElementById('quiz-input-text');
            const val = inputField.value;
            if (!val || !val.trim()) return;

            isInteractionLocked = true;

            const btn = document.getElementById('btn-valider');
            const originalText = btn.innerText;
            
            inputField.disabled = true; 
            btn.classList.add('disabled'); 
            btn.innerHTML = `<svg class="btn-loader" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

            submitAnswer(val.trim(), btn, originalText);
        }

        async function submitAnswer(userAnswer, uiElement, originalText = "") {
            const sessionId = getSessionId();
            
            try {
                const res = await fetchQuizAPI('/validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        user_answer: userAnswer,
                        lang: state.lang
                    })
                });

                const data = await res.json();
                
                if (data.error) {
                    console.error(data.error);
                    return;
                }

                state.step = data.current_step;
                state.progress = data.consecutive_correct;
                localStorage.setItem('dh7_progress', JSON.stringify({step: state.step, progress: state.progress}));

                if(uiElement && uiElement.classList.contains('opt-btn')) {
                    if (data.correct) {
                        uiElement.classList.remove('processing');
                        uiElement.classList.add('success');
                    }
                } else if (uiElement && uiElement.id === 'btn-valider') {
                    uiElement.innerText = originalText; 
                }

                showFeedback(data.correct, data.explanation || "");
                updateDashboard();

            } catch (e) {
                console.error(e);
            } finally {
                isInteractionLocked = false;
            }
        }

        function showFeedback(success, explanation) {
            const sheet = document.getElementById('feedback-sheet');
            const title = document.getElementById('fb-title');
            const desc = document.getElementById('fb-desc');
            const t = translations[state.lang];

            sheet.classList.toggle('err', !success);

            title.innerText = success ? t.success_title : t.error_title;
            desc.innerText = explanation;
            
            sheet.classList.add('show');
        }

        function nextQuestion() {
            const sheet = document.getElementById('feedback-sheet');
            sheet.classList.remove('show');
            loadQuizQuestion(); 
        }

        function actionWithLang(callback) {
            pendingAction = callback;
            openLangModal();
        }

        function openLangModal() {
            toggleMenu(false);
            document.getElementById('backdrop').classList.add('active');
            document.getElementById('lang-modal').classList.add('active');
        }

        async function setLang(l) {
            showSplash();
            const startT = Date.now();
            state.lang = l;
            localStorage.setItem('language', l);
            closeOverlays();
            applyTranslations();
            if (document.getElementById('view-quiz').classList.contains('active')) {
                await loadQuizQuestion();
            }
            if (document.getElementById('view-dashboard').classList.contains('active')) {
                await updateDashboard();
            }
            if (pendingAction) {
                const action = pendingAction;
                pendingAction = null;
                action();
            }
            const elap = Date.now() - startT;
            setTimeout(hideSplash, Math.max(0, 1500 - elap));
        }

        let swipeModal = null;
        let startY = 0;
        let currentY = 0;

        document.querySelectorAll('.lang-modal, .ios-info-modal').forEach(modal => {
            modal.addEventListener('touchstart', (e) => {
                if (modal.scrollTop === 0) {
                    swipeModal = modal;
                    startY = e.touches[0].clientY;
                    swipeModal.style.transition = 'none';
                }
            }, {passive: true});
            
            modal.addEventListener('touchmove', (e) => {
                if (!swipeModal) return;
                currentY = e.touches[0].clientY - startY;
                if (currentY > 0) {
                    swipeModal.style.transform = `translateY(${currentY}px)`;
                }
            }, {passive: true});
            
            modal.addEventListener('touchend', (e) => {
                if (!swipeModal) return;
                swipeModal.style.transition = 'transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1)';
                
                if (currentY > 100 || (currentY > 20 && e.changedTouches[0].clientY - startY > 50)) {
                    closeOverlays();
                } else {
                    swipeModal.style.transform = 'translateY(0)';
                }
                
                swipeModal = null;
                currentY = 0;
            });
        });

        function closeOverlays() {
            document.getElementById('backdrop').classList.remove('active');
            document.getElementById('side-menu').classList.remove('open');
            document.querySelectorAll('.lang-modal, .ios-info-modal').forEach(m => {
                m.classList.remove('active');
                setTimeout(() => m.style.transform = '', 350);
            });
        }

        function applyTranslations() {
            const t = translations[state.lang];
            document.querySelectorAll('[data-key]').forEach(el => {
                const k = el.dataset.key;
                if(t[k]) {
                    if(el.tagName === 'INPUT') el.placeholder = t[k];
                    else el.innerText = t[k];
                }
            });
        }

        let touchX = 0;
        const menuEl = document.getElementById('side-menu');
        menuEl.addEventListener('touchstart', e => touchX = e.changedTouches[0].screenX, {passive: true});
        menuEl.addEventListener('touchend', e => {
            if(touchX - e.changedTouches[0].screenX > 50) toggleMenu(false);
        }, {passive: true});

        router.init();
        applyTranslations();
    </script>
    <script>
  navigator.serviceWorker.register('sw.js')
  .then(registration => console.log('Service worker registered'))
  .catch(error => console.error('Error registering service worker:', error));
</script>
